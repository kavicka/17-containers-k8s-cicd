[project]
name = "containers-k8s-cicd"
version = "0.1.0"
description = "Step 17: the step 15 app in containers, Kubernetes, CI/CD and Terraform (plots + scripts only here)"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
extend-exclude = ["app"]
