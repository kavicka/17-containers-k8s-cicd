server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SSE: pass tokens through as they arrive instead of buffering the whole answer
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        return 200 "ok\n";
    }
}
